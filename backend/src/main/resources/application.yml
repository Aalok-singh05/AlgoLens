server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

app:
  auth:
    mode: oauth

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/algovault}
    username: ${SPRING_DATASOURCE_USERNAME:algovault}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:algovault-api}
  audience: ${JWT_AUDIENCE:algovault-extension}
  expiration: ${JWT_EXPIRATION_MS:86400000}

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:chrome-extension://nglebofiomebgndkkdecnmolafjdphhf}

logging:
  level:
    root: INFO
    com.algovault: INFO
